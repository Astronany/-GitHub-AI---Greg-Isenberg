name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "临时覆盖 BASE_URL；留空则用 Secret 或公开默认地址"
        required: false
        type: string
  schedule:
    # 每天 02:00 UTC 跑一次公开默认（或 Secret 中的）环境
    - cron: "0 2 * * *"

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # 手动触发时优先用输入；否则用仓库 Secret。两者都空时，测试代码回落到 JSONPlaceholder。
      BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || secrets.BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

      - name: Show JUnit summary
        if: always()
        run: python .github/scripts/junit_summary.py

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: reports/junit.xml
          if-no-files-found: warn
